# Folia test server. Separate data dir from the Paper compose so the two never
# share a world (Folia's region format isn't interchangeable with Paper's).
# Uses the same port (25565) as the Paper server, so only run ONE at a time.
#   just folia-up      # start it (first run downloads Folia + generates world)
#   just folia-down
#   just folia-cmd "tps"
services:
  folia:
    image: itzg/minecraft-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FOLIA"
      VERSION: "1.21.11"
      MEMORY: ${MC_MEMORY:-4G}
      ONLINE_MODE: "FALSE"
      ENABLE_COMMAND_BLOCK: "TRUE"
      ALLOW_FLIGHT: "TRUE"
      SPAWN_PROTECTION: 0
      DIFFICULTY: easy
      MAX_PLAYERS: 200
      MOTD: "ServerTools Folia"
      # only Folia-capable plugins here so the server boots clean
      # (spark's spigot build isn't folia-marked, so it's left out on purpose)
      MODRINTH_PROJECTS: "luckperms,placeholderapi"
      OPS: "reecepbcups"
      RCON_CMDS_STARTUP: "lp user reecepbcups permission set * true"
    volumes:
      - ./server-folia:/data
    stdin_open: true
    tty: true
