services:
  mc:
    image: itzg/minecraft-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.20.4"
      MEMORY: ${MC_MEMORY:-2G}
      ONLINE_MODE: "FALSE"
      ENABLE_COMMAND_BLOCK: "TRUE"
      SPAWN_PROTECTION: 0
      DIFFICULTY: easy
      MAX_PLAYERS: 5
      MOTD: "ServerTools E2E"
      # soft-depends: Vault (34315), PlaceholderAPI (6245)
      SPIGET_RESOURCES: "34315,6245"
      MODRINTH_PROJECTS: "luckperms,plugmanx"
    volumes:
      - mc-data:/data
      - ./server/plugins:/plugins
    stdin_open: true
    tty: true

volumes:
  mc-data:
