services:
  mc:
    image: itzg/minecraft-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.20.4"
      MEMORY: ${MC_MEMORY:-2G}
      ONLINE_MODE: "FALSE"
      ENABLE_COMMAND_BLOCK: "TRUE"
      SPAWN_PROTECTION: 0
      DIFFICULTY: easy
      MAX_PLAYERS: 200
      MOTD: "ServerTools E2E"
      MODRINTH_PROJECTS: "luckperms,plugmanx,placeholderapi,vaultunlocked"
      SPIGET_RESOURCES: "57242" # spark (https://modrinth.com/mod/spark)
      PATCH_DEFINITIONS: "/patches"
      OPS: "reecepbcups"
    volumes:
      - ./server:/data
      - ./patches:/patches:ro
    stdin_open: true
    tty: true
